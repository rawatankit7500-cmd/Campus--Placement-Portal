<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="form-container">
        <div class="form-box">

            <h1 class="form-title">🎓 Student Registration</h1>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">

                <!-- NAME + ERP -->
                <div class="form-row">
                    <input type="text" name="name" placeholder="Full Name" required>
                    <input type="text" name="erp_id" placeholder="ERP ID" required>
                </div>

                <!-- EMAIL + PHONE -->
                <div class="form-row">
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="text" name="phone" placeholder="Phone" required>
                </div>

                <!-- ROLL + SECTION -->
                <div class="form-row">
                    <input type="text" name="roll_no" placeholder="Roll No" required>
                    <input type="text" name="section" placeholder="Section" required>
                </div>

                <!-- FAMILY -->
                <div class="form-row">
                    <input type="text" name="father_name" placeholder="Father Name" required>
                    <input type="text" name="mother_name" placeholder="Mother Name" required>
                </div>

                <!-- DOB -->
                <input type="date" name="dob" required>

                <!-- COURSE -->
                <div class="form-row">
                    <input type="text" name="college" placeholder="College" required>
                    <input type="text" name="course" placeholder="Course" required>
                </div>

                <input type="text" name="year" placeholder="Semester" required>

                <!-- ACADEMIC -->
                <div class="form-row">
                    <input type="number" step="0.01" name="high_school" placeholder="High School %" required>
                    <input type="number" step="0.01" name="intermediate" placeholder="Intermediate %" required>
                </div>

                <input type="number" step="0.01" name="cgpa" placeholder="CGPA" required>

                <!-- ADDRESS -->
                <textarea name="address" placeholder="Enter Address" rows="3" required></textarea>

                <!-- PHOTO UPLOAD -->
                <label class="simple-box">
                    <span id="photoText">📷 Upload your Professional Photo</span>
                    <input type="file" name="photo" id="photoInput" hidden required>
                </label>

                <!-- RESUME UPLOAD -->
                <label class="simple-box">
                    <span id="resumeText">📄 Upload your Resume</span>
                    <input type="file" name="resume" id="resumeInput" hidden required>
                </label>

                <!-- PASSWORD -->
                <input type="password" name="password" placeholder="Password" required>

                <!-- BUTTON -->
                <button type="submit" class="btn">Register</button>

            </form>

            <p style="margin-top:15px; text-align:center;">
                Already have an account?
                <a href="/login/student">Login</a>
            </p>

        </div>
    </div>

    <!-- UPLOAD STATUS SCRIPT -->
    <script>
        document.getElementById("photoInput").addEventListener("change", function () {
            let fileName = this.files[0].name;
            document.getElementById("photoText").innerText = "✅ " + fileName;
        });

        document.getElementById("resumeInput").addEventListener("change", function () {
            let fileName = this.files[0].name;
            document.getElementById("resumeText").innerText = "✅ " + fileName;
        });
    </script>

</body>
</html>
