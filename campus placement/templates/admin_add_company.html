<!DOCTYPE html>
<html>
<head>
    <title>Add Company</title>
    <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>

<div class="dashboard">

    <!-- RIGHT PANEL FULL WIDTH -->
    <div class="right-panel" style="width:100%; margin-left:0;">

        <!-- TOPBAR -->
        <div class="topbar">
            <h2 class="welcome-text">➕ Add Company</h2>
        </div>

        <!-- FORM -->
        <form method="POST" action="/admin/add_company">

            <input type="text" name="company_name" placeholder="Company Name" required>

            <input type="text" name="job_role" placeholder="Job Role" required>

            <input type="text" name="package" placeholder="Package (e.g. 5 LPA)" required>

            <input type="number" step="0.1" name="eligibility_cgpa" placeholder="Minimum CGPA" required>

            <input type="text" name="required_skills" placeholder="Required Skills" required>

            <input type="text" name="location" placeholder="Location" required>

            <input type="date" name="visit_date" required>

            <br>

            <button type="submit" class="btn">Add Company</button>

        </form>

        <!-- BOTTOM -->
        <div class="bottom-actions">
            <a href="/admin/dashboard" class="btn">⬅ Back to Dashboard</a>
            <a href="/logout" class="btn logout">Logout</a>
        </div>

    </div>

</div>

</body>
</html>
